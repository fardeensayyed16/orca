{{define "services"}}
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orca Services</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<style>
body{font:15px system-ui,sans-serif;background:#f4f4f4;color:#222;margin:0}
nav{background:#222;padding:1rem}nav a{color:#fff;margin-right:1rem}
main{max-width:1100px;margin:2rem auto;padding:0 1rem}
table{border-collapse:collapse;width:100%;background:#fff}th,td{text-align:left;padding:.65rem;border-bottom:1px solid #ddd}
button{background:#397a55;color:#fff;border:0;padding:.45rem .7rem;cursor:pointer}
input{padding:.4rem;margin:.2rem}
</style></head><body>
<nav><a href="/">Home</a><a href="/nodes">Nodes</a><a href="/services">Services</a><a href="/pods">Pods</a></nav>
<main><h1>Services</h1>
<form method="post" action="/api/v1/gui/deploy">
<input name="name" placeholder="Name" required>
<input name="image" placeholder="Image" required>
<input name="replicas" type="number" min="1" value="1" required>
<label>Port: <input type="number" name="container_port" min="1" max="65535" value="80" required></label>
<button type="submit">Deploy</button>
</form>
<div hx-get="/api/v1/gui/services" hx-trigger="every 30s" hx-swap="outerHTML">
<table><tr><th>Name</th><th>Image</th><th>Replicas</th><th>Port</th><th>Actions</th></tr>
{{range .Services}}<tr><td>{{.Name}}</td><td>{{.Image}}</td><td>{{.Replicas}}</td><td>{{.ServicePort}}</td><td>
<form method="post" action="/api/v1/gui/scale"><input type="hidden" name="name" value="{{.Name}}"><input name="replicas" type="number" min="1" value="{{.Replicas}}" required><button type="submit">Scale</button></form>
<form method="post" action="/api/v1/gui/delete-service"><input type="hidden" name="name" value="{{.Name}}"><button type="submit">Delete</button></form>
</td></tr>{{end}}</table></div></main></body></html>
{{end}}
